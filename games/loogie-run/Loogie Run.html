<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1"
    />
    <title>Loogie Run</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050605;
        color: #f3f6ef;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        touch-action: none;
      }

      body {
        display: grid;
        place-items: center;
      }

      canvas {
        display: block;
        width: min(100vw, 56.25vh);
        height: min(177.78vw, 100vh);
        max-width: 100vw;
        max-height: 100vh;
        background: #5b9ec0;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="360" height="640" aria-label="Loogie Run"></canvas>

    <script>
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;
      const groundY = 510;
      const player = {
        x: 82,
        y: groundY,
        w: 28,
        h: 44,
        vy: 0,
        hold: 0,
        holding: false,
      };
      const state = {
        screen: "menu",
        score: 0,
        best: Number(localStorage.getItem("loogie-run-best") || 0),
        distance: 0,
        speed: 235,
        nextSpawn: width + 190,
        frameTime: 0,
        marks: Array.from({ length: 8 }, (_, index) => index * 48),
        obstacles: [],
      };
      const walkImage = new Image();
      const jumpImage = new Image();
      walkImage.src = "./loogie_walk_spritesheet.png";
      jumpImage.src = "./loogie_jump_spritesheet.png";

      function resetGame() {
        state.screen = "playing";
        state.score = 0;
        state.distance = 0;
        state.speed = 235;
        state.nextSpawn = width + 190;
        state.obstacles = [];
        state.marks = Array.from({ length: 8 }, (_, index) => index * 48);
        player.y = groundY;
        player.vy = 0;
        player.hold = 0;
        player.holding = false;
      }

      function endGame() {
        state.screen = "over";
        player.holding = false;
        state.best = Math.max(state.best, state.score);
        localStorage.setItem("loogie-run-best", String(state.best));
      }

      function press() {
        if (state.screen !== "playing") {
          resetGame();
          return;
        }

        player.holding = true;
        if (player.y >= groundY - 0.5) {
          player.vy = -650;
          player.hold = 0;
        }
      }

      function release() {
        player.holding = false;
        if (player.vy < 0 && player.hold < 0.2) {
          player.vy *= 0.46;
        }
      }

      function spawnObstacle() {
        const airborne = Math.random() < 0.34;
        if (airborne) {
          const h = rand(34, 48);
          state.obstacles.push({
            x: state.nextSpawn,
            y: groundY - rand(118, 164) - h,
            w: rand(44, 68),
            h,
            color: "#eb4538",
          });
          return;
        }

        const h = rand(48, 80);
        state.obstacles.push({
          x: state.nextSpawn,
          y: groundY - h,
          w: rand(26, 44),
          h,
          color: "#1c2117",
        });
      }

      function update(delta) {
        if (state.screen !== "playing") {
          return;
        }

        state.speed = Math.min(520, state.speed + 7.2 * delta);
        state.distance += state.speed * delta;
        state.score = Math.floor(state.distance / 16);

        const gravity =
          player.holding && player.vy < 0 && player.hold < 0.2 ? 966 : 2100;
        if (player.holding && player.vy < 0) {
          player.hold += delta;
        }
        player.vy += gravity * delta;
        player.y += player.vy * delta;
        if (player.y >= groundY) {
          player.y = groundY;
          player.vy = 0;
          player.hold = 0.2;
        }

        for (const obstacle of state.obstacles) {
          obstacle.x -= state.speed * delta;
        }
        state.obstacles = state.obstacles.filter((obstacle) => obstacle.x > -90);

        while (state.nextSpawn <= width + 70) {
          spawnObstacle();
          state.nextSpawn += rand(210, 405) + state.speed * 0.18;
        }
        state.nextSpawn -= state.speed * delta;

        state.marks = state.marks.map((mark) => {
          let next = mark - state.speed * delta;
          if (next <= -48) {
            next += width + 96;
          }
          return next;
        });

        const body = {
          x: player.x - 10,
          y: player.y - 42,
          w: 23,
          h: 40,
        };
        if (state.obstacles.some((obstacle) => overlaps(body, obstacle))) {
          endGame();
        }
      }

      function draw() {
        drawWorld();
        drawObstacles();
        drawPlayer();
        drawHud();
        if (state.screen === "menu") {
          drawPanel("Loogie Run", `Best ${state.best}`, "Play");
        } else if (state.screen === "over") {
          drawPanel("Game Over", `Score ${state.score}   Best ${state.best}`, "Retry");
        }
      }

      function drawWorld() {
        ctx.fillStyle = "#5b9ec0";
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "#78be54";
        ctx.fillRect(0, 340, width, height - 340);
        ctx.fillStyle = "#b6ec4a";
        ctx.fillRect(0, groundY - 10, width, 10);
        ctx.fillStyle = "#1e2319";
        ctx.fillRect(0, groundY, width, 54);
        ctx.fillStyle = "#d9ff71";
        for (const mark of state.marks) {
          ctx.fillRect(mark, groundY + 22, 24, 6);
        }
      }

      function drawObstacles() {
        for (const obstacle of state.obstacles) {
          ctx.fillStyle = obstacle.color;
          roundedRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h, 6);
        }
      }

      function drawPlayer() {
        const grounded = player.y >= groundY - 0.5;
        if (grounded && walkImage.complete && walkImage.width) {
          const frame = 1 + (Math.floor(state.frameTime * 13) % 4);
          drawSprite(walkImage, 5, frame, player.x - 29, player.y - 78, 72, 72);
          return;
        }

        if (jumpImage.complete && jumpImage.width) {
          const frame = player.vy < -210 ? 3 : player.vy < 130 ? 4 : 5;
          drawSprite(jumpImage, 12, frame, player.x - 29, player.y - 78, 72, 72);
        }
      }

      function drawHud() {
        ctx.fillStyle = "#f3f6ef";
        ctx.textAlign = "center";
        ctx.font = "800 34px system-ui, sans-serif";
        ctx.fillText(String(state.score), width / 2, 55);
        ctx.textAlign = "right";
        ctx.font = "800 16px system-ui, sans-serif";
        ctx.fillText(String(Math.round(state.speed)), width - 20, 46);
        if (state.screen === "playing" && state.score < 8) {
          ctx.textAlign = "center";
          ctx.font = "700 18px system-ui, sans-serif";
          ctx.fillText("Tap to jump. Hold for height.", width / 2, height - 82);
        }
      }

      function drawPanel(title, line, button) {
        ctx.fillStyle = "rgba(5, 6, 5, 0.58)";
        ctx.fillRect(0, 0, width, height);
        ctx.textAlign = "center";
        ctx.fillStyle = "#f3f6ef";
        ctx.font = "900 52px system-ui, sans-serif";
        ctx.fillText(title, width / 2, 270);
        ctx.font = "800 22px system-ui, sans-serif";
        ctx.fillText(line, width / 2, 318);
        ctx.fillStyle = "#b6ec4a";
        roundedRect(70, 350, 220, 56, 8);
        ctx.fillStyle = "#17200f";
        ctx.font = "900 24px system-ui, sans-serif";
        ctx.fillText(button, width / 2, 386);
      }

      function drawSprite(image, frames, frame, x, y, w, h) {
        const frameWidth = image.width / frames;
        ctx.drawImage(image, frameWidth * frame, 0, frameWidth, image.height, x, y, w, h);
      }

      function roundedRect(x, y, w, h, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, radius);
        ctx.fill();
      }

      function overlaps(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      let lastTime = performance.now();
      function tick(time) {
        const delta = Math.min(0.033, (time - lastTime) / 1000);
        lastTime = time;
        state.frameTime += delta;
        update(delta);
        draw();
        requestAnimationFrame(tick);
      }

      addEventListener("pointerdown", (event) => {
        event.preventDefault();
        press();
      });
      addEventListener("pointerup", (event) => {
        event.preventDefault();
        release();
      });
      addEventListener("pointercancel", release);
      addEventListener("keydown", (event) => {
        if (event.code === "Space" || event.code === "ArrowUp") {
          event.preventDefault();
          if (!event.repeat) {
            press();
          }
        }
      });
      addEventListener("keyup", (event) => {
        if (event.code === "Space" || event.code === "ArrowUp") {
          event.preventDefault();
          release();
        }
      });

      requestAnimationFrame(tick);
    </script>
  </body>
</html>
